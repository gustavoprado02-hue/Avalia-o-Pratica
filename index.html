<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copero Career - Modo Carreira Realista</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

  <header>
    <div class="header-content">
      <h1>COPERO CAREER</h1>
      <button id="theme-toggle" class="btn-theme">☀️ Modo Claro</button>
    </div>
  </header>

  <main class="container">

    <section id="setup-card" class="card">
      <h2>Configurar Carreira</h2>
      <div class="form-group">
        <label for="player-name">Nome do Jogador:</label>
        <input type="text" id="player-name" value="Craque" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label for="user-team-select">Seu Time/Seleção:</label>
        <select id="user-team-select"></select>
      </div>

      <div class="form-group">
        <label for="rival-team-select">Adversário:</label>
        <select id="rival-team-select"></select>
      </div>

      <button id="start-game-btn" class="btn-action primary">Iniciar Partida</button>
    </section>

    <div id="game-screen" class="hidden">
      
      <section class="card match-card">
        <div class="scoreboard">
          <div class="team">
            <img id="home-flag" src="" alt="Time Casa">
            <span id="home-name">Casa</span>
          </div>
          <div class="score" id="score-display">0 - 0</div>
          <div class="team">
            <img id="away-flag" src="" alt="Time Fora">
            <span id="away-name">Fora</span>
          </div>
        </div>
        <div class="match-info">
          <span id="match-minute">0'</span> | <span id="match-status">1º Tempo</span>
        </div>
      </section>

      <section class="card gameplay-card">
        <div class="story-box">
          <p id="scenario-text">A partida está prestes a começar!</p>
        </div>
        <div class="actions-box" id="choices-container">
          </div>
      </section>

      <section class="card stats-card">
        <h3>Estatísticas do Atleta</h3>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="stat-matches">0</span>
            <span class="stat-label">Jogos</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-goals">0</span>
            <span class="stat-label">Gols</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-assists">0</span>
            <span class="stat-label">Assistências</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-stamina">100%</span>
            <span class="stat-label">Stamina</span>
          </div>
        </div>
      </section>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
